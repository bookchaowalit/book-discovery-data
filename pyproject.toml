[project]
name = "book-discovery-data"
version = "0.1.0"
description = "Lake-first technology discovery data contract for Solo Empire."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
book-discovery-data = "discovery_data.api:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E9", "F", "I", "B", "UP"]
