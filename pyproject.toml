[project]
name = "book-discovery-data"
version = "0.1.0"
description = "Lake-first technology discovery data contract for Solo Empire."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Shared lake-first runtime (Bronze Parquet, DuckDB reads), pinned to an exact
# commit so CI runs the lake tests reproducibly. Without the
# package, SOLO_DATA_LAKE_ROOT may point at a solo-data-lake checkout.
lake = [
  "solo-empire-data-lake[lake] @ https://github.com/bookchaowalit/solo-empire-data-lake/archive/b8f8698995a4d4283247bd432d521b337ef8ec94.tar.gz",
]
dev = ["pytest>=7", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
book-discovery-data = "discovery_data.api:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E9", "F", "I", "B", "UP"]
