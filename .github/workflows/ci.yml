name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tools
        run: python -m pip install "pytest>=7" "ruff>=0.5"
      - name: Lint
        run: ruff check .
      - name: Tests (offline; shared lake runtime tests skip with a reason)
        run: python -m pytest -q -rs
