name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # [lake] installs the pinned solo-empire-data-lake runtime, so the
      # Bronze round-trip tests run here instead of skipping.
      - name: Install package with dev tools and the shared lake runtime
        run: python -m pip install -e ".[dev,lake]"
      - name: Check shared lake runtime is importable
        run: python -c "from discovery_data import store; assert store.shared_runtime_available()"
      - name: Lint
        run: ruff check .
      - name: Tests (offline; lake tests write only to a temp directory)
        run: python -m pytest -q -rs
